
set-option -g prefix C-a
unbind C-b
bind C-a send-prefix

set-option -g base-index 1
set-option -g pane-base-index 1
set-option -g renumber-windows on

set-option -g mouse on

set-option -g history-limit 1000000

set-option -g set-titles on
set-option -g set-titles-string "#{pane_title}"

bind c new-window -c "#{pane_current_path}"
# Splits go through adb-split.sh so panes in an adb window (prefix + a) keep ANDROID_SERIAL.
bind '"' run-shell '$HOME/.tmux/scripts/adb-split.sh "#{pane_id}" "#{pane_current_path}" -v'
bind % run-shell '$HOME/.tmux/scripts/adb-split.sh "#{pane_id}" "#{pane_current_path}" -h'

# prefix + a: new window, pick an adb device with fzf, and scope ANDROID_SERIAL to
# that window only (stored as @adb_serial and shown after the index as <serial>).
bind a new-window -c "#{pane_current_path}" "sh $HOME/.tmux/scripts/adb-window.sh"

set-option -s escape-time 0

set -g default-terminal "tmux-256color"

set -as terminal-overrides ',xterm-256color:RGB:Tc:smcup@:rmcup@:kbs=\177:bpaste'
set -as terminal-overrides ',alacritty*:RGB:Tc:smcup@:rmcup@:kbs=\177:bpaste'

# Enables OSC 52 clipboard writes from tmux's own copy-mode (y / copy-selection),
# so copying works over SSH by having the local terminal set the system clipboard.
#
# This must be terminal-features, not a hand-written Ms= terminal-override: the
# override replaces the capability with a string tmux cannot expand, and tmux
# then emits nothing at all. The feature covers every TERM, including the ones
# that do not match tmux's built-in xterm*:clipboard rule.
set -as terminal-features ',*:clipboard'

set -g set-clipboard on
# A tmux server started from the remote's own desktop keeps WAYLAND_DISPLAY,
# which is not in the default list, so an SSH attach would never clear it and
# clipboard tools in new panes would aim at the remote desktop.
set -ga update-environment ' WAYLAND_DISPLAY'
set -g assume-paste-time 0

set -g status-style bg=default,fg=default
set -g window-style 'bg=default'
set -g window-active-style 'bg=default'

BG="#191724"
FG="#e0def4"
DARK_GOLD="#6f5211"
BRIGHT_GOLD="#d8a657"
GOLD_FG="#ebdbb2"
BLACK="#1d2021"

set-option -g status-style bg=default,fg=${FG}
# centre, not absolute-centre: absolute-centre centres on the whole width and
# lets a long window list run over the session name and the branch. centre
# keeps it in the space between them and truncates it (with < >) when full;
# padding in status-left/right keeps that space centred on the screen.
set-option -g status-justify centre

set-option -g status-left "\
#[fg=${DARK_GOLD},bg=default]\
#[bg=${DARK_GOLD},fg=${GOLD_FG}] #S \
#[fg=${DARK_GOLD},bg=default]\
#(sh $HOME/.tmux/scripts/status-git.sh pad left '#{session_id}' \"#S\" \"#{pane_current_path}\" #{client_width} #{session_windows})\
"

# Both sides are padded to the same width where there is room (status-git.sh
# pad), so the windows stay centred when the branch name changes length.
# #{session_windows} is passed only so the padding is recomputed at once when
# a window opens or closes.
set-option -g status-right "\
#(sh $HOME/.tmux/scripts/status-git.sh pad right '#{session_id}' \"#S\" \"#{pane_current_path}\" #{client_width} #{session_windows})\
#[fg=${DARK_GOLD},bg=default]\
#[bg=${DARK_GOLD},fg=${GOLD_FG}] #(sh $HOME/.tmux/scripts/status-git.sh branch \"#{pane_current_path}\") \
#[fg=${DARK_GOLD},bg=default]\
"

set-option -g status-left-length 100
set-option -g status-right-length 100

set-option -g automatic-rename on
set-option -g automatic-rename-format "generic"

# The tab turns green while the window has @need_attention, a window option
# that only ~/.tmux/scripts/attn.sh sets or clears (attn_on/attn_off, M-F, and
# the Claude Code / opencode hooks all go through it).
set-option -g window-status-format " #{?@need_attention,#[fg=#2ea043],}#W#[fg=${FG}] (#I#{?@adb_serial,#[dim]|#{@adb_serial}#[nodim],}) "
set-option -g window-status-separator ""

set -g @window-wrap-normal      "#[fg=${DARK_GOLD},bg=default]#[bg=${DARK_GOLD},fg=${GOLD_FG}]"
set -g @window-wrap-normal-end  "#[fg=${DARK_GOLD},bg=default]"

set -g @window-wrap-zoomed      "#[fg=#fae7b5,bg=default]#[bg=#fae7b5,fg=${BLACK}]"
set -g @window-wrap-zoomed-end  "#[fg=#fae7b5,bg=default]"

set-option -g window-status-current-format " #{?#{&&:#{window_zoomed_flag},#{>:#{window_panes},1}},#{@window-wrap-zoomed},#{@window-wrap-normal}} #{?@need_attention,#[fg=#2ea043],}#W#{?#{&&:#{window_zoomed_flag},#{>:#{window_panes},1}},#[fg=${BLACK}],#[fg=${GOLD_FG}]} (#I#{?@adb_serial,#[dim]|#{@adb_serial}#[nodim],}) #{?#{&&:#{window_zoomed_flag},#{>:#{window_panes},1}},#{@window-wrap-zoomed-end},#{@window-wrap-normal-end}} "

# tmux's default status-format[0], except the < > markers it draws when the
# window list is cut: they turn green while a window cut off on that side has
# @need_attention (status-git.sh arrow works out which windows are cut). The
# last argument - window count, current window, which windows are green and
# the name lengths - is there only so the arrows update the moment it changes.
set-option -g status-format[0] "\
#[align=left range=left #{E:status-left-style}]#[push-default]#{T;=/#{status-left-length}:status-left}#[pop-default]#[norange default]#[list=on align=#{status-justify}]\
#[list=left-marker]#(sh $HOME/.tmux/scripts/status-git.sh arrow left '#{session_id}' \"#S\" \"#{pane_current_path}\" #{client_width} #{session_windows}.#{active_window_index}.#{W:#{?@need_attention,1,0}}.#{W:#{n:window_name}-})<#[default]#[list=right-marker]#(sh $HOME/.tmux/scripts/status-git.sh arrow right '#{session_id}' \"#S\" \"#{pane_current_path}\" #{client_width} #{session_windows}.#{active_window_index}.#{W:#{?@need_attention,1,0}}.#{W:#{n:window_name}-})>#[default]\
#[list=on]#{W:#[range=window|#{window_index} #{E:window-status-style}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-format}#[pop-default]#[norange default]#{?window_end_flag,,#{window-status-separator}},#[range=window|#{window_index} list=focus #{?#{!=:#{E:window-status-current-style},default},#{E:window-status-current-style},#{E:window-status-style}}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-current-format}#[pop-default]#[norange list=on default]#{?window_end_flag,,#{window-status-separator}}}#[nolist align=right range=right #{E:status-right-style}]#[push-default]#{T;=/#{status-right-length}:status-right}#[pop-default]#[norange default]\
"

set-hook -gu window-layout-changed
set-hook -gu after-select-window
set-hook -gu client-session-changed

set-option -g pane-border-style "fg=${DARK_GOLD},bg=default"
set-option -g pane-active-border-style "fg=${BRIGHT_GOLD},bg=default"

bind -n M-H select-pane -L
bind -n M-J select-pane -D
bind -n M-K select-pane -U
bind -n M-L select-pane -R

bind -n M-h send-keys Left
bind -n M-j send-keys Down
bind -n M-k send-keys Up
bind -n M-l send-keys Right

bind -n M-I previous-window
bind -n M-O next-window

bind -n M-: resize-pane -Z

bind -n M-N command-prompt -p "Rename window:" "rename-window -- '%%'"

bind -n C-S-x resize-pane -Z

bind -n M-a copy-mode

# Alt+Shift+F: toggle the green "needs attention" tab on the current window
# (dismiss it, or bring it back). Same as the attn_tog shell command.
bind -n M-F run-shell '$HOME/.tmux/scripts/attn.sh tog "#{pane_id}"'

setw -g mode-keys vi

bind -T copy-mode-vi v send -X begin-selection
# Every copy goes through copy-command: y, mouse drag, Enter and the default
# double/triple-click bindings all use copy-pipe with no command of their own.
# Besides the tmux buffer (and OSC 52, via set-clipboard), this hands the text
# to the system clipboard tool - which is what reaches the local clipboard over
# SSH with X11 forwarding (xclip), where the terminal ignores OSC 52.
set -s copy-command "CLIP_FROM_TMUX=1 sh $HOME/.tmux/scripts/clip-copy.sh"
bind -T copy-mode-vi y send -X copy-pipe \; send -X clear-selection

# Neutralize Space in copy-mode: tmux's built-in default binds it to
# begin-selection, which re-anchors/collapses an active selection if pressed
# again mid-selection (e.g. right before y). Unbound = no-op, so an accidental
# Space press can't clobber your selection.
unbind -T copy-mode-vi Space
bind -T copy-mode-vi Escape send -X clear-selection
bind -T copy-mode-vi q send -X clear-selection
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe

bind | run-shell '$HOME/.tmux/scripts/adb-split.sh "#{pane_id}" "#{pane_current_path}" -h'
bind - run-shell '$HOME/.tmux/scripts/adb-split.sh "#{pane_id}" "#{pane_current_path}" -v'

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind -n M-S run-shell 'tmux command-prompt -p "Save history to:" "capture-pane -e -S - ; save-buffer %% ; delete-buffer"'

bind -n M-R display-popup -E -x 0 -y 0 -w 24 -h 3 -T " move window " \
  "sh $HOME/.tmux/scripts/move-window.sh"

# Alt+Shift+P: copy the previous line (the last command's output line, without
# its newline). The clipboard tool is chosen by clip-copy.sh, which works on
# both macOS and Linux - no nested if-shell quoting.
bind -n M-P copy-mode \; \
  send-keys -X cursor-up \; \
  send-keys -X select-line \; \
  send-keys -X copy-pipe-and-cancel "tr -d '\\n' | sh $HOME/.tmux/scripts/clip-copy.sh"

bind -n M-B display-panes -d 1500 \; run-shell -b 'layout=$(tmux display-message -p "#{window_layout}"); \
  printf "%s" "$layout" | sh "$HOME/.tmux/scripts/clip-copy.sh" || tmux set-buffer "$layout"; \
  tmux display-message "Layout copied: $layout"'

set -g visual-activity off
set -g focus-events on
set -ga terminal-overrides ',*:focus=on'

run-shell -b "tmux set-hook -g pane-focus-out \"run-shell -b '##{@kitty_clear_graphics}'\" 2>/dev/null || true"
run-shell -b "tmux set-hook -g pane-focus-in \"run-shell -b '##{@kitty_clear_graphics}'\" 2>/dev/null || true"
run-shell -b "tmux set-hook -g client-focus-out \"run-shell -b '##{@kitty_clear_graphics}'\" 2>/dev/null || true"
run-shell -b "tmux set-hook -g client-focus-in \"run-shell -b '##{@kitty_clear_graphics}'\" 2>/dev/null || true"
run-shell -b "tmux set-hook -g client-session-changed \"run-shell -b '##{@kitty_clear_graphics}'\" 2>/dev/null || true"
run-shell -b "tmux set-hook -g window-linked \"run-shell -b '##{@kitty_clear_graphics}'\" 2>/dev/null || true"

unbind-key z
bind-key z run-shell -b "tmux resize-pane -Z; tmux run-shell -b '#{@kitty_reset_and_notify}'"


bind -n C-l send-keys C-l \; run-shell "tmux clear-history" \; send-keys C-l

# Load tmux-jump
run-shell ~/.tmux/plugins/tmux-jump/tmux-jump.tmux

# Bind Alt+Shift+G (M-G) directly without prefix to tmux-jump
bind-key -n M-G run-shell -b "$HOME/.tmux/plugins/tmux-jump/scripts/tmux-jump.sh"

if-shell "[ -f ~/.tmux.conf.personal ]" "source-file ~/.tmux.conf.personal"
